version: '3.8'

services:
  server-dash:
    build: .
    container_name: server-dash
    restart: always
    ports:
      - "3001:3001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./dist:/app/dist
      - ./server:/app/server
      - /tmp:/tmp
    environment:
      - NODE_ENV=production
      - PORT=3001
